<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>MealMuse | Premium AI Nutrition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,900;1,900&display=swap" rel="stylesheet">
    <style>
      :root { --sage: #94a37e; --pink: #fce4ec; --cream: #fffaf0; }
      body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--cream); margin: 0; overflow-x: hidden; }
      .font-editorial { font-family: 'Playfair Display', serif; }
      .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
      .soft-shadow { box-shadow: 0 20px 40px -15px rgba(148, 163, 126, 0.15); }
      .floating { animation: float 6s ease-in-out infinite; }
      @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-20px); } 100% { transform: translateY(0px); } }
    </style>
