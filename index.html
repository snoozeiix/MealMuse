<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MealMuse | Premium AI Nutrition Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              lavender: '#BFA6FF',
              blush: '#F8CFE1',
              butter: '#FFE4A8',
              neutralDark: '#1A1A1A',
              softGray: '#7A7A7A',
              bgOffWhite: '#F7F7F7',
            },
            borderRadius: { '3xl': '30px', '4xl': '40px' },
            boxShadow: {
              'premium': '0 20px 50px -12px rgba(0, 0, 0, 0.05)',
              'float': '0 30px 60px -12px rgba(191, 166, 255, 0.15)',
            }
          }
        }
      }
    </script>
    <style>
      body { font-family: 'Inter', sans-serif; background-color: #F7F7F7; color: #1A1A1A; -webkit-font-smoothing: antialiased; }
      h1, h2, h3, h4 { font-family: 'Sora', sans-serif; letter-spacing: -0.02em; }
      .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.4); }
      .editorial-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px; }
      .floating { animation: floating 6s ease-in-out infinite; }
      @keyframes floating { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #F7F7F7; }
      ::-webkit-scrollbar-thumb { background: #BFA6FF; border-radius: 10px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
