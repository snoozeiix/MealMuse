<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MealMuse | Premium AI Nutrition Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,900;1,600;1,900&family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cream: '#FAF8F4',
              blush: '#F8EEF1',
              lavender: '#B8A3FF',
              matcha: '#CFE6C8',
              butter: '#FFE8A3',
              dark: '#1B1B1B',
              slateText: '#6F6F6F',
              borderSep: '#ECE8E2'
            },
            borderRadius: { '3xl': '24px', '4xl': '32px', '5xl': '48px' },
            boxShadow: { 'luxury': '0 20px 50px -12px rgba(27, 27, 27, 0.05)', 'float': '0 30px 60px -12px rgba(184, 163, 255, 0.15)' }
          }
        }
      }
    </script>
    <style>
      body { font-family: 'Inter', sans-serif; background-color: #FAF8F4; color: #1B1B1B; -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
      .font-editorial { font-family: 'Playfair Display', serif; }
      .font-ui { font-family: 'Sora', sans-serif; }
      .glass { background: rgba(250, 248, 244, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(236, 232, 226, 0.5); }
      .floating { animation: float 6s ease-in-out infinite; }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
      .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
